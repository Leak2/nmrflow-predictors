# ---------------------------------------------------------------------------
# 以下条目由 tools/mine_hetero.py 从 NMRShiftDB2 **训练集**（非 holdout）统计得出：
# 每个 value 是该环境类别在库内的位移**中位数**，width 取平均绝对偏差。
# 加入依据是"用该中位数预测比用兜底常数明显更准"，逐类的 (记录数, 中位MAE, 兜底MAE)
# 见该脚本输出。留出集不参与取值，因此后面的 A/B 评估是干净的。
#
# ★ 顺序即匹配优先级：本段追加在通用条目之后，但下面每条 SMARTS 都把四个取代基
#   写全了，与前面的条目互斥，所以顺序不影响结果。唯一需要小心的是最后一条
#   "四碳鎓"——它故意不要求形式电荷，往前放会抢走 phosphonium。
# ---------------------------------------------------------------------------


