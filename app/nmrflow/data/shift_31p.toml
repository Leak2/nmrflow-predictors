# 31P 化学位移（参考 85% H3PO4 外标，低场为正）
#
# v0.2.0：补 20 个环境（原表只有 14 条，库内 56% 的 P 原子无表项可命中）。
# 取值来自 tools/mine_hetero.py 对 NMRShiftDB2 训练集的统计，不含留出集。
#
# v0.3.0：所有 width 改用实测半宽 (P90−P10)/2。原来手填的 5~25 普遍偏窄
# （如 tertiary phosphine 手填 25、实测 38；phosphonic dichloride 填 25、实测 78），
# 等于把峰画得比数据库里的实际离散更锐，是过度承诺。

version = "0.3.0"

[fallback]
value = 0.0
width = 40.0
confidence = "low"
note = "未命中环境表，给出宽峰估计而非精确值"


