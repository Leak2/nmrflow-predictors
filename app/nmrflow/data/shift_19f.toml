# 19F 化学位移（参考 CFCl3）
#
# v0.3.0 新增 "CF3-sp2"（CF₃ 接乙烯基/亚胺碳，原两条 CF₃ 规则都要求 sp³ 邻居而漏掉，
#        库内 147 条训练记录掉进兜底 −120 / 实测 −61.5）与 "CF3-halogen"；
#        N-CF3 的 SMARTS 由 [NX3] 放宽到 [NX2,NX3]（亚胺氮上的 CF₃，15 条，中位 −59.3）。
#        取值来自 tools/mine_hetero.py 对 NMRShiftDB2 训练集的统计，不含留出集。
#
# 19F 跨度几百 ppm，加和法在这里基本无效，改用"环境 SMARTS -> 值"直接查表。
# width = 该环境的典型跨度（ppm），未命中时给一个宽峰而不是假精确单峰。
#
# ★ 所有 SMARTS 都必须以 [FX1] 开头 ★
#   表描述的是"这个氟原子处在什么环境里"，F 自己就是模式的根。
#   匹配器要求 match[0] == 待查 F 的索引。
#   旧版以 C 为根，判定条件只是"该 F 出现在某个匹配里"：SO2F 上的 F 因此被
#   alpha-CF2 的条目抢走，整个谱塌成一个峰。
#
#   分支写法仍然是坑：F-C 之后还要再接基团时，只有一个能走主链，
#   其余必须写成括号分支，如 [FX1][CX4](F)(F)[SX4](=O)(=O)。

version = "0.3.0"

[fallback]
value = -120.0
width = 25.0
confidence = "low"
note = "未命中环境表，给出的是宽峰估计而非精确值"

# ---------------------------------------------------------------- CF3 ----
# 顺序：越具体越靠前，先命中者胜出。

[[env]]
name = "Ar-CF3"
smarts = "[FX1][CX4]([c])(F)F"
value = -63.0
width = 5.0
confidence = "high"

[[env]]
name = "CF3-SO2- (三氟甲磺酰 / triflyl)"
smarts = "[FX1][CX4](F)(F)[SX4](=O)(=O)"
value = -78.0
width = 4.0
confidence = "high"
# 2 层球 HOSE 在 CF3-SO2- 上会拉到 -58 左右（σ 也不小）；表值 -78 是
# 文献/训练集锚定值，不能被浅层命中覆盖。
protect = true

[[env]]
name = "CF3-C(=O) (三氟甲基酮)"
smarts = "[FX1][CX4](F)(F)[CX3]=[OX1]"
value = -76.0
width = 8.0
confidence = "medium"

[[env]]
name = "Rf-CF3 (全氟烷基末端, F3C-CF2-)"
smarts = "[FX1][CX4](F)(F)[CX4](F)(F)"
value = -82.0
width = 5.0
confidence = "medium"

[[env]]
name = "ArO-CF3 (三氟甲氧基)"
smarts = "[FX1][CX4](F)(F)[OX2]"
value = -58.5
width = 5.0
confidence = "medium"

[[env]]
name = "CF3-S- (三氟甲硫基)"
smarts = "[FX1][CX4](F)(F)[SX2]"
value = -42.0
width = 8.0
confidence = "medium"

[[env]]
# N 可能是 NX3（胺）也可能是 NX2（亚胺/腙的 =N-）。
# 库内 =N-CF3 有 15 条记录，中位 −59.3，与本条 −55.0 只差 4 ppm，放宽即可，不另立条目。
name = "N-CF3"
smarts = "[FX1][CX4](F)(F)[NX2,NX3]"
value = -55.0
width = 10.0
confidence = "low"

[[env]]
name = "Alkyl-CF3"
smarts = "[FX1][CX4](F)(F)[CX4;!$(C=[!#6])]"
value = -70.0
width = 10.0
confidence = "medium"

# CF3 接在 sp² 碳上（乙烯基 / 亚胺碳）。
# 原表的两条都要求邻居是 [CX4]（Alkyl-CF3 / Rf-CF3），于是 FC(F)(F)C=C(Cl)Cl
# 这种结构两条都不命中，掉进兜底 −120（实测 −61.8，差 58 ppm）。
# 库内训练集中该环境 147 条记录，中位 −61.5，半宽 7。
[[env]]
name = "CF3-sp2 (CF3 接乙烯基/亚胺碳)"
smarts = "[FX1][CX4](F)(F)[CX3]"
value = -61.5
width = 7.0
confidence = "medium"

# CF3 接卤素（CF3Cl −28.6 / CF3Br −18.1）。库内记录少、离散大，只给 low。
[[env]]
name = "CF3-halogen (CF3Cl / CF3Br)"
smarts = "[FX1][CX4](F)(F)[Cl,Br,I]"
value = -23.4
width = 8.0
confidence = "low"

[[env]]
name = "CF3 (兜底)"
smarts = "[FX1][CX4](F)(F)F"
value = -70.0
width = 15.0
confidence = "low"

# ---------------------------------------------------------------- Ar-F ---

[[env]]
name = "Ar-F"
smarts = "[FX1][c]"
value = -113.0
width = 15.0
confidence = "medium"

# ------------------------------------------- 卤代乙烷（XCF2-CFY，1,2-二卤）------
# 这一族 δ 不是"F 所在的那个碳"单独决定的，两个碳的卤素组合一起决定：
#   CF2Cl 旁边是 CFClI → −63.4；旁边是 CFCl2 → −68.1（差 4.7 ppm）
# 所以下面几条 SMARTS 把**邻碳的卤素**一并写进模式，只覆盖两个碳的卤素都确定的情形，
# 不做泛化。19F 的 HOSE 索引在这些环境上最多只有 2 层球，且 σ≈7.7–8.9（2 层球分不出
# CF2Cl / CF2I / CF2Br，只能给一个混合均值），因此这几条标了 protect = true：
# 浅层命中不得覆盖它们，见 shift_hose.overlay_tier_b。
#
# 取值来源两条独立路径，互为校验：
#   ① JFC 1995, 74, 261–267（正文 p.262、实验 p.266）
#   ② 2026-11-12 实测，376 MHz，CDCl3
# 两路差值均 < 0.5 ppm。
#
# 未采信的一项：文献给 ICF2CFClI 的 CF2I 为 −120.0，偏离常见 CF2I 区间
# （−50 ~ −62），文献卡片自己也标了"建议自行复测"，故不写入表。

[[env]]
name = "CF2Cl-CFClI (CF2Cl 端, 1,2-二氯-1-碘三氟乙烷)"
smarts = "[FX1][CX4](F)(Cl)[CX4](F)(Cl)I"
value = -63.4
width = 3.0
confidence = "high"
protect = true

[[env]]
name = "CF2Cl-CFClI (CFClI 端, 同上)"
smarts = "[FX1][CX4](Cl)(I)[CX4](F)(F)Cl"
value = -71.9
width = 3.0
confidence = "high"
protect = true

[[env]]
name = "CF2I-CFCl2 (CF2I 端, 1,2-二氯-1-碘三氟乙烷异构体)"
smarts = "[FX1][CX4](F)(I)[CX4](F)(Cl)Cl"
value = -54.8
width = 3.0
confidence = "high"
protect = true

[[env]]
name = "CF2I-CFCl2 (CFCl2 端, 同上)"
smarts = "[FX1][CX4](Cl)(Cl)[CX4](F)(F)I"
value = -67.3
width = 3.0
confidence = "high"
protect = true

# X = Cl 的副产物 ClCF2CFCl2（文献单一路来源，只给 medium，仍 protect：
# 它的两个值同样落在 2 层球会把 CF2Cl 拉偏的区间里）。
[[env]]
name = "CF2Cl-CFCl2 (CF2Cl 端, 1,1,2-三氯三氟乙烷)"
smarts = "[FX1][CX4](F)(Cl)[CX4](F)(Cl)Cl"
value = -68.1
width = 4.0
confidence = "medium"
protect = true

[[env]]
name = "CF2Cl-CFCl2 (CFCl2 端, 同上)"
smarts = "[FX1][CX4](Cl)(Cl)[CX4](F)(F)Cl"
value = -72.4
width = 4.0
confidence = "medium"
protect = true

# 单氟、连两个卤素、另一个邻居是碳：CFCl2 / CFClI / CBrClF 这一类的通用项。
# 没有它，这类碳（只有一个 F，不满足任何 CF2/CF3/CHF 模式）会掉进 −120 兜底，
# CFClI 实测 −71.9，差 48 ppm。值取这一族的中心，宽度给足；不标 protect，
# 因为具体环境一旦被 HOSE 用 3 层球命中，那比这个通用值更可信。
[[env]]
name = "R-CF(X)2 (单氟二卤代 sp3 碳)"
smarts = "[FX1][CX4;H0;!$(C(F)(F))]([Cl,Br,I])[#6]"
value = -72.0
width = 12.0
confidence = "low"

# --------------------------------------------------------------- CF2 ------
# 全氟链的 α / 内部 / 末端差别很大，必须分开给值。
# !$(C(F)(F)F) 把 CF3 排除掉，否则 CF3 的 F 也会落进 CF2 条目。

[[env]]
name = "Rf alpha-CF2 邻磺酰氟 (Rf-CF2-SO2F)"
smarts = "[FX1][CX4;!$(C(F)(F)F)](F)[SX4](=O)(=O)F"
value = -110.0
width = 6.0
confidence = "medium"

[[env]]
name = "Rf alpha-CF2 邻磺酸根 (Rf-CF2-SO3-)"
smarts = "[FX1][CX4;!$(C(F)(F)F)](F)[SX4](=O)(=O)[OX1-]"
value = -114.0
width = 6.0
confidence = "medium"

[[env]]
name = "Rf alpha-CF2 邻磺酸酯 (Rf-CF2-SO2-O)"
smarts = "[FX1][CX4;!$(C(F)(F)F)](F)[SX4](=O)(=O)[OX2]"
value = -109.0
width = 6.0
confidence = "medium"

[[env]]
name = "Rf alpha-CF2 邻砜 (Rf-CF2-SO2-C)"
smarts = "[FX1][CX4;!$(C(F)(F)F)](F)[SX4](=O)(=O)[#6]"
value = -114.0
width = 7.0
confidence = "medium"

# 全氟链的"邻居是谁"决定位移：
#   邻 SO3-/SO2R 等吸电子端  -> -110 ~ -115（最去屏蔽）
#   邻 CH2 / CH（链尾接饱和碳） -> -115 左右（6:2 FTS 的 [CF2]a = -115.1）
#   邻 CF3（次末端）          -> -126 左右（PFOS 的 C2 = -125.6 ~ -127.1）
#   两侧都是 CF2（链内部）     -> -121 ~ -123
# 所以下面的规则按"邻居类型"逐条给出，链内那条必须**两侧都是碳**，
# 否则连在 S 上的 alpha-CF2 也会被它抢走（两个 CF2 撞成同一个值、谱塌成单峰）。

[[env]]
name = "Rf-CF2-CH (全氟链末端接饱和碳)"
smarts = "[FX1][CX4;!$(C(F)(F)F)](F)[CX4;H1,H2,H3]"
value = -115.0
width = 6.0
confidence = "medium"

[[env]]
name = "Rf-CF2-CF3 (全氟链次末端)"
smarts = "[FX1][CX4;!$(C(F)(F)F)](F)[CX4](F)(F)F"
value = -126.0
width = 5.0
confidence = "medium"

[[env]]
name = "Rf 链内 -CF2- (两侧均为全氟碳)"
smarts = "[FX1][CX4;!$(C(F)(F)F)](F)([CX4])[CX4]"
value = -122.0
width = 6.0
confidence = "medium"

[[env]]
name = "R-CF2-R (兜底)"
smarts = "[FX1][CX4;H0;!$(C(F)(F)F)](F)"
value = -115.0
width = 12.0
confidence = "low"

